# Robot: never put the Bluetooth speaker (or the USB mic) to sleep when idle.
# Waking it cut off the first ~0.5 s of every sound: the start of Jarvis's replies was lost.
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.usb-Audio_Array.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
