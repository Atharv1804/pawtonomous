<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis Face</title>
<style>
  :root { --bg: #05070b; --eye: #4fe3ff; --glow: rgba(79, 227, 255, 0.35); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Robot face: polls the pet brain (/display) ~20x per second and animates smoothly in between.
// Expressions: neutral happy curious focused searching sleepy sad surprised listening thinking.
const cv = document.getElementById("c"), g = cv.getContext("2d");
const SHAPES = {               // open: eye height 0..1, lid: inner-lid tilt (+ = angry/focused), smile: mouth curve
  neutral:   {open: 1.0,  lid: 0.0,   smile: 0.25, pupil: 1.0},
  happy:     {open: 0.75, lid: -0.1,  smile: 1.0,  pupil: 1.1, squint: 0.5},
  curious:   {open: 1.1,  lid: -0.15, smile: 0.35, pupil: 1.15, tiltOne: 0.25},
  focused:   {open: 0.8,  lid: 0.25,  smile: 0.1,  pupil: 0.9},
  searching: {open: 1.0,  lid: 0.0,   smile: 0.15, pupil: 1.0, scan: 1},
  sleepy:    {open: 0.3,  lid: 0.0,   smile: 0.1,  pupil: 0.9},
  sad:       {open: 0.8,  lid: -0.35, smile: -0.6, pupil: 1.0},
  surprised: {open: 1.3,  lid: 0.0,   smile: 0.0,  pupil: 0.7, o: 1},
  listening: {open: 1.1,  lid: -0.1,  smile: 0.3,  pupil: 1.2},
  thinking:  {open: 0.9,  lid: 0.1,   smile: 0.05, pupil: 1.0, lookUp: 1},
  sleeping:  {open: 0.05, lid: 0.0,   smile: 0.2,  pupil: 0.8, zzz: 1},
};
let state = {expression: "neutral", gaze_x: 0, talk: {envelope: [], step: 0.05, start: 0}, now: 0};
let clockOffset = 0;                       // brain time - browser time
let cur = Object.assign({gx: 0, gy: 0, mouth: 0, squint: 0, tiltOne: 0, o: 0, scan: 0, lookUp: 0, zzz: 0}, SHAPES.neutral);
// Blink as a small state machine: wait -> closing -> opening -> wait (3-7 s). The old version could
// re-trigger while still opening, which chained into rapid double blinks.
let blinkPhase = "wait", blinkAt = performance.now() + 3000, blink = 0;

async function poll() {
  try {
    const r = await fetch("/display", {cache: "no-store"});
    const s = await r.json();
    clockOffset = s.now - Date.now() / 1000;
    state = s;
  } catch (e) { /* brain restarting: keep the last face */ }
  setTimeout(poll, 80);
}
poll();

function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", resize); resize();

const lerp = (a, b, k) => a + (b - a) * k;

function talkLevel() {
  const t = state.talk || {};
  const env = t.envelope || [];
  const i = Math.floor((Date.now() / 1000 + clockOffset - t.start) / (t.step || 0.05));
  return (i >= 0 && i < env.length) ? env[i] : 0;
}

function roundRect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function eye(cx, cy, w, h, side, t) {
  const open = Math.max(0.04, cur.open * (1 - blink) * (side < 0 ? 1 + cur.tiltOne : 1));
  const eh = h * open;
  g.save();
  g.shadowColor = getComputedStyle(document.documentElement).getPropertyValue("--glow");
  g.shadowBlur = w * 0.08;
  g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--eye");
  roundRect(cx - w / 2, cy - eh / 2, w, eh, Math.min(w, eh) * 0.35);
  g.fill();
  g.shadowBlur = 0;
  // pupil (dark) follows the gaze
  const pr = w * 0.17 * cur.pupil;
  let px = cx + cur.gx * w * 0.22, py = cy + cur.gy * eh * 0.22;
  if (state.anim && state.anim.name === "spin_eyes") {        // treat: pupils whirl round and round
    const ang = t / 90 * side;
    px = cx + Math.cos(ang) * w * 0.22; py = cy + Math.sin(ang) * eh * 0.22;
  }
  if (eh > pr * 1.4) { g.fillStyle = "#05070b"; g.beginPath(); g.arc(px, py, pr, 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,255,255,0.85)"; g.beginPath(); g.arc(px - pr * 0.35, py - pr * 0.35, pr * 0.28, 0, Math.PI * 2); g.fill(); }
  // eyelids: tilted top lid (angry/focused or sad) and a cheek for happy squints
  g.fillStyle = "#05070b";
  const tilt = cur.lid * h * 0.5 * side;
  g.beginPath();
  g.moveTo(cx - w, cy - eh / 2 - h); g.lineTo(cx + w, cy - eh / 2 - h);
  g.lineTo(cx + w * 0.6, cy - eh / 2 + Math.max(0, tilt)); g.lineTo(cx - w * 0.6, cy - eh / 2 + Math.max(0, -tilt));
  g.closePath(); g.fill();
  if (cur.squint > 0.02) {
    g.beginPath(); g.ellipse(cx, cy + eh / 2 + h * 0.18, w * 0.75, h * 0.42 * cur.squint, 0, Math.PI, 0, true); g.fill();
  }
  g.restore();
}

function mouth(cx, cy, w, h, t) {
  const level = cur.mouth;
  g.save();
  g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--eye");
  g.fillStyle = "#0b2a33";
  g.lineWidth = Math.max(4, w * 0.045); g.lineCap = "round";
  g.shadowColor = getComputedStyle(document.documentElement).getPropertyValue("--glow"); g.shadowBlur = w * 0.03;
  if (cur.o > 0.5 && level < 0.05) {                  // surprised "o"
    g.beginPath(); g.ellipse(cx, cy, w * 0.12, h * 0.35, 0, 0, Math.PI * 2); g.stroke();
  } else if (level > 0.04) {                          // talking: open mouth sized by voice loudness
    const mh = h * (0.15 + level * 0.85), mw = w * (0.55 + level * 0.15);
    roundRect(cx - mw / 2, cy - mh / 2, mw, mh, mh * 0.5); g.fill(); g.stroke();
  } else {                                            // closed: smile / frown curve
    const s = cur.smile * h * 0.6;
    g.beginPath(); g.moveTo(cx - w * 0.32, cy - s * 0.3);
    g.quadraticCurveTo(cx, cy + s, cx + w * 0.32, cy - s * 0.3); g.stroke();
  }
  g.restore();
}

// ---------- demo extras: paw wave, spinning eyes, countdown, selfie, full camera view, view dot ----------
const C = () => getComputedStyle(document.documentElement).getPropertyValue("--eye");
let localView = null, localViewAt = 0;          // a tap switches at once, before the brain confirms
const view = () => (localView && Date.now() - localViewAt < 1500) ? localView : (state.view || "face");

// Touch controls: view dot (bottom right), selfie dot (left of it), STOP while moving, BACK on a selfie.
const MOVING = ["follow", "follow_straight", "go_to", "find", "wander", "curious", "look_at"];
function dotRect(W, H) { const r = Math.max(18, H * 0.035); return {x: W - r * 2.2, y: H - r * 2.2, r: r}; }
function selfieDot(W, H) { const d = dotRect(W, H); return {x: d.x - d.r * 3.2, y: d.y, r: d.r * 0.8}; }
function stopRect(W, H) { const w = W * 0.30, h = H * 0.13; return {x: (W - w) / 2, y: H * 0.03, w: w, h: h}; }
function followRect(W, H) { const w = W * 0.20, h = H * 0.09; return {x: W * 0.02, y: H - h - H * 0.03, w: w, h: h}; }
function backRect(W, H) { const w = W * 0.20, h = H * 0.11; return {x: W * 0.03, y: H * 0.04, w: w, h: h}; }
const selfieTime = () => (state.anim && state.anim.name === "countdown") || !!state.photo;
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
let pressed = {name: "", at: 0};                           // brief visual feedback on a tap
function post(path, body) { fetch(path, {method: "POST", body: JSON.stringify(body || {})}).catch(() => {}); }
cv.addEventListener("pointerdown", (e) => {
  const W = cv.width, H = cv.height, s = devicePixelRatio, x = e.clientX * s, y = e.clientY * s;
  const d = dotRect(W, H), sd = selfieDot(W, H);
  if (selfieTime() && inRect(x, y, backRect(W, H))) {          // BACK: no photo / close the photo
    post("/demo", {action: "cancel"}); pressed = {name: "back", at: Date.now()};
    state.anim = null; state.photo = 0; return;
  }
  if (MOVING.includes(state.mode) && inRect(x, y, stopRect(W, H))) {
    post("/stop"); pressed = {name: "stop", at: Date.now()}; return;
  }
  if (!MOVING.includes(state.mode) && view() === "face" && !selfieTime() && inRect(x, y, followRect(W, H))) {
    post("/command", {mode: "follow_straight", target: "any", timeout: 180});   // same as "Hey Jarvis, follow me"
    pressed = {name: "follow", at: Date.now()}; return;
  }
  if (Math.hypot(x - sd.x, y - sd.y) < sd.r * 2.2) {
    post("/demo", {action: "selfie"}); pressed = {name: "selfie", at: Date.now()}; return;
  }
  if (Math.hypot(x - d.x, y - d.y) < d.r * 2.5) {           // generous hit area for a finger
    localView = view() === "camera" ? "face" : "camera"; localViewAt = Date.now();
    post("/view", {view: localView});
  }
});
function drawButtons(W, H) {
  const sd = selfieDot(W, H);                                // small selfie dot: a tiny camera ring
  g.save(); g.globalAlpha = pressed.name === "selfie" && Date.now() - pressed.at < 400 ? 1 : 0.6;
  g.strokeStyle = C(); g.lineWidth = 3;
  g.beginPath(); g.arc(sd.x, sd.y, sd.r, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(sd.x, sd.y, sd.r * 0.35, 0, Math.PI * 2); g.stroke();
  g.restore();
  const font = (k) => "bold " + Math.round(H * k) + "px -apple-system, Roboto, sans-serif";
  if (MOVING.includes(state.mode)) {                          // big STOP while it is moving on its own
    const r = stopRect(W, H), hit = pressed.name === "stop" && Date.now() - pressed.at < 500;
    g.save(); g.fillStyle = hit ? "#ffffff" : "#e5484d"; roundRect(r.x, r.y, r.w, r.h, r.h * 0.3); g.fill();
    g.fillStyle = hit ? "#e5484d" : "#ffffff"; g.font = font(0.07); g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("STOP", r.x + r.w / 2, r.y + r.h / 2 + 2); g.restore();
  }
  if (!MOVING.includes(state.mode) && view() === "face" && !selfieTime() && !state.said) {   // small FOLLOW ME button
    const r = followRect(W, H), hit = pressed.name === "follow" && Date.now() - pressed.at < 500;
    g.save(); g.globalAlpha = hit ? 1 : 0.75;
    g.strokeStyle = C(); g.lineWidth = 3; roundRect(r.x, r.y, r.w, r.h, r.h * 0.3);
    if (hit) { g.fillStyle = C(); g.fill(); } else { g.stroke(); }
    g.fillStyle = hit ? "#05070b" : C(); g.font = font(0.035); g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("FOLLOW ME", r.x + r.w / 2, r.y + r.h / 2 + 1); g.restore();
  }
  if (selfieTime()) {                                          // BACK: cancel the selfie
    const r = backRect(W, H), hit = pressed.name === "back" && Date.now() - pressed.at < 500;
    g.save(); g.fillStyle = hit ? "#ffffff" : "rgba(5,7,11,0.75)"; roundRect(r.x, r.y, r.w, r.h, r.h * 0.3); g.fill();
    g.strokeStyle = "#ffffff"; g.lineWidth = 3; g.stroke();
    g.fillStyle = hit ? "#05070b" : "#ffffff"; g.font = font(0.05); g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("< BACK", r.x + r.w / 2, r.y + r.h / 2 + 2); g.restore();
  }
}
function drawDot(W, H) {
  drawButtons(W, H);
  const d = dotRect(W, H);
  g.save(); g.globalAlpha = 0.75;
  g.fillStyle = view() === "camera" ? "#ff5a5a" : C();
  g.beginPath(); g.arc(d.x, d.y, d.r * 0.55, 0, Math.PI * 2); g.fill();
  g.strokeStyle = C(); g.lineWidth = 3; g.beginPath(); g.arc(d.x, d.y, d.r, 0, Math.PI * 2); g.stroke();
  g.restore();
}

// Live camera: on the robot the page streams straight from the Pi's camera service (smooth, nothing goes
// through the Mac); face boxes come from the Mac in /display. Elsewhere it falls back to Mac snapshots.
const LIVE_URL = "http://127.0.0.1:8767/stream";
const live = new Image(); let liveOn = false, liveOk = location.hostname === "127.0.0.1";
live.onerror = () => { liveOk = false; liveOn = false; };
const full = new Image(); let fullLoading = false;
const wantLive = () => view() === "camera" || (state.anim && state.anim.name === "countdown");
setInterval(() => {
  const want = wantLive();
  if (liveOk && want !== liveOn) {                    // open the stream only while it is on screen
    liveOn = want; live.src = want ? LIVE_URL + "?t=" + Date.now() : "";
  }
  if (!want || liveOk || fullLoading) return;
  fullLoading = true;                                 // fallback: one annotated picture at a time
  const img = new Image();
  img.onload = () => { full.src = img.src; fullLoading = false; };
  img.onerror = () => { fullLoading = false; };
  img.src = "/frame.jpg?annotated=1&w=640&t=" + Date.now();
}, 150);
function drawLive(W, H) {                             // returns false if there is no picture yet
  const src = liveOk ? live : full;
  if (!src.naturalWidth) return false;
  const s = Math.min(W / src.naturalWidth, H / src.naturalHeight), w = src.naturalWidth * s, h = src.naturalHeight * s;
  const x0 = (W - w) / 2, y0 = (H - h) / 2;
  g.drawImage(src, x0, y0, w, h);
  if (liveOk) {
    g.save(); g.lineWidth = Math.max(3, H * 0.006);
    g.font = "bold " + Math.round(H * 0.05) + "px -apple-system, Roboto, sans-serif"; g.textBaseline = "bottom";
    for (const b of state.boxes || []) {
      const color = b.owner ? "#50dc50" : "#ffaa00";
      const bx = x0 + b.x * w, by = y0 + b.y * h, bw = b.w * w, bh = b.h * h;
      g.strokeStyle = color; g.lineWidth = b.kind === "face" ? Math.max(3, H * 0.006) : 1.5;
      g.strokeRect(bx, by, bw, bh);
      if (b.kind !== "face") continue;
      const tw = g.measureText(b.label).width + 16, th = H * 0.06;
      const ty = by - th < H * 0.08 ? by : by - th;   // under the header bar: put the label inside the box
      g.fillStyle = color; g.fillRect(bx, ty, tw, th);
      g.fillStyle = "#000000"; g.fillText(b.label, bx + 8, ty + th - 4);
    }
    g.restore();
  }
  return true;
}
function drawFullCamera(W, H) {
  g.fillStyle = "#05070b"; g.fillRect(0, 0, W, H);
  drawLive(W, H);
  g.save();
  g.font = "bold " + Math.round(H * 0.04) + "px -apple-system, Roboto, sans-serif";
  g.textBaseline = "top"; g.fillStyle = "rgba(5,7,11,0.65)"; g.fillRect(0, 0, W, H * 0.075);
  g.fillStyle = C(); g.textAlign = "left";
  g.fillText("JARVIS VISION  ·  faces: " + (state.faces || 0) + "  ·  friends met: " + (state.friends || 0), W * 0.02, H * 0.018);
  g.textAlign = "right"; g.fillStyle = state.owner_here ? "#7dff8a" : "#ffb347";
  g.fillText(state.owner_here ? "OWNER FOUND" : "looking for owner...", W * 0.98, H * 0.018);
  g.restore();
}

// paw wave: a big cartoon paw rocking side to side, with "Hi!"
function drawPaw(W, H, t) {
  const cx = W / 2, cy = H * 0.47, s = Math.min(W, H) * 0.20, a = Math.sin(t / 160) * 0.45;
  g.save(); g.translate(cx, cy + s * 1.2); g.rotate(a); g.translate(0, -s * 1.2);
  g.fillStyle = C(); g.shadowColor = "rgba(79,227,255,0.4)"; g.shadowBlur = s * 0.2;
  g.beginPath(); g.ellipse(0, s * 0.35, s * 0.62, s * 0.52, 0, 0, Math.PI * 2); g.fill();      // main pad
  for (const [x, y, r] of [[-0.62, -0.32, 0.22], [-0.22, -0.62, 0.24], [0.22, -0.62, 0.24], [0.62, -0.32, 0.22]]) {
    g.beginPath(); g.ellipse(x * s, y * s, r * s, r * s * 1.2, 0, 0, Math.PI * 2); g.fill();     // toes
  }
  g.restore();
  g.save(); g.fillStyle = C(); g.textAlign = "center";
  g.font = "bold " + Math.round(H * 0.11) + "px -apple-system, Roboto, sans-serif";
  g.fillText(state.anim && state.anim.text ? state.anim.text : "Hi!", W / 2, H * 0.9); g.restore();
}

function drawCountdown(W, H) {                        // selfie: the live picture it is about to take + 3-2-1
  const a = state.anim, left = Math.ceil(a.until - (Date.now() / 1000 + clockOffset));
  g.fillStyle = "#05070b"; g.fillRect(0, 0, W, H);
  const shown = drawLive(W, H);
  g.save(); g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = shown ? "rgba(255,255,255,0.55)" : C();
  g.font = "bold " + Math.round(H * 0.4) + "px -apple-system, Roboto, sans-serif";
  g.fillText(String(Math.min(3, Math.max(1, left))), W / 2, H / 2);
  g.font = "bold " + Math.round(H * 0.07) + "px -apple-system, Roboto, sans-serif";
  g.fillStyle = "rgba(5,7,11,0.6)"; g.fillRect(0, H * 0.86, W, H * 0.14);
  g.fillStyle = C(); g.fillText("Say cheese!", W / 2, H * 0.93);
  g.restore();
}

const selfie = new Image(); let selfieId = 0;
function drawSelfie(W, H) {
  if (state.photo !== selfieId) { selfieId = state.photo; selfie.src = "/selfie.jpg?id=" + selfieId; }
  g.fillStyle = "#05070b"; g.fillRect(0, 0, W, H);
  if (selfie.width) {
    const s = Math.min(W * 0.9 / selfie.width, H * 0.78 / selfie.height), w = selfie.width * s, h = selfie.height * s;
    g.fillStyle = "#ffffff"; g.fillRect((W - w) / 2 - 10, H * 0.06 - 10, w + 20, h + 20);
    g.drawImage(selfie, (W - w) / 2, H * 0.06, w, h);
  }
  g.save(); g.fillStyle = C(); g.textAlign = "center";
  g.font = "bold " + Math.round(H * 0.055) + "px -apple-system, Roboto, sans-serif";
  g.fillText("Selfie! Sent to Atharv's Telegram", W / 2, H * 0.94); g.restore();
}

// Mini camera feed (picture-in-picture): shown only when the brain asks (remarks, every ~30 s exploring).
const cam = new Image();
let camLoading = false, camShown = false;
function refreshCam() {
  if (!state.camera || camLoading) return;
  camLoading = true;
  const img = new Image();
  img.onload = () => { cam.src = img.src; camLoading = false; camShown = true; };
  img.onerror = () => { camLoading = false; };
  img.src = "/frame.jpg?annotated=1&w=320&t=" + Date.now();   // resized + annotated on the Mac
}
setInterval(refreshCam, 250);   // ~4 fps while visible: light on the Pi

function drawCam(W, H) {
  if (!state.camera || !camShown || !cam.width) return;
  const w = W * 0.30, h = w * cam.height / cam.width, x = W - w - W * 0.02, y = H * 0.03;
  g.save();
  g.fillStyle = "rgba(79, 227, 255, 0.85)";
  g.fillRect(x - 3, y - 3, w + 6, h + 6);
  g.drawImage(cam, x, y, w, h);
  const cap = state.camera.caption || "";
  if (cap) {
    g.font = Math.round(H * 0.035) + "px -apple-system, 'Segoe UI', Roboto, sans-serif";
    g.textAlign = "center"; g.textBaseline = "top";
    g.fillStyle = "rgba(79, 227, 255, 0.95)";
    g.fillText(cap, x + w / 2, y + h + 8);
  }
  g.restore();
}

function wrapLines(text, maxW, maxLines) {
  const words = text.split(/\s+/), lines = [];
  let line = "";
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else { line = t; }
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) {                       // long answers: show the latest part
    const keep = lines.slice(-maxLines); keep[0] = "... " + keep[0]; return keep;
  }
  return lines;
}
function drawSaid(W, H, text) {
  g.save();
  const fs = Math.round(H * 0.055);
  g.font = "600 " + fs + "px -apple-system, 'Segoe UI', Roboto, sans-serif";
  const lines = wrapLines(text, W * 0.86, 3), lh = fs * 1.25;
  const bh = lines.length * lh + fs * 0.8, by = H - bh - H * 0.02;
  g.fillStyle = "rgba(14, 22, 33, 0.92)"; roundRect(W * 0.05, by, W * 0.9, bh, fs * 0.6); g.fill();
  g.strokeStyle = C(); g.lineWidth = 2; g.stroke();
  g.fillStyle = "#e8f6fb"; g.textAlign = "center"; g.textBaseline = "middle";
  lines.forEach((l, i) => g.fillText(l, W / 2, by + fs * 0.4 + lh * (i + 0.5)));
  g.restore();
}
function drawHeard(W, H, text) {
  g.save();
  const fs = Math.round(H * 0.04);
  g.font = "italic " + fs + "px -apple-system, 'Segoe UI', Roboto, sans-serif";
  const line = wrapLines("You said: \u201c" + text + "\u201d", W * 0.8, 1)[0];
  g.fillStyle = "rgba(125, 147, 163, 0.95)"; g.textAlign = "center"; g.textBaseline = "top";
  g.fillText(line, W / 2, MOVING.includes(state.mode) ? H * 0.18 : H * 0.03);   // below STOP when moving
  g.restore();
}

let lastDraw = 0;
function drawZzz(W, H, ts) {
  if (cur.zzz < 0.5) return;
  g.save(); g.fillStyle = C(); g.textAlign = "left";
  for (let i = 0; i < 3; i++) {
    const p = ((ts / 1400) + i / 3) % 1;
    g.globalAlpha = 1 - p;
    g.font = "bold " + Math.round(H * (0.05 + 0.03 * i)) + "px -apple-system, Roboto, sans-serif";
    g.fillText("z", W * (0.72 + 0.05 * i), H * (0.32 - 0.18 * p - 0.06 * i));
  }
  g.restore();
}

function frame(ts) {
  if (ts - lastDraw < 33) { requestAnimationFrame(frame); return; }   // ~30 fps keeps the Pi cool
  lastDraw = ts;
  const shape = SHAPES[state.expression] || SHAPES.neutral;
  const k = 0.18;
  for (const key of ["open", "lid", "smile", "pupil"]) cur[key] = lerp(cur[key], shape[key], k);
  for (const key of ["squint", "tiltOne", "o", "scan", "lookUp", "zzz"]) cur[key] = lerp(cur[key], shape[key] || 0, k);
  // gaze: toward the tracked person; wander side to side while searching; up while thinking
  let gx = state.gaze_x || 0;
  if (cur.scan > 0.5) gx = Math.sin(ts / 600);
  cur.gx = lerp(cur.gx, gx, 0.2);
  cur.gy = lerp(cur.gy, cur.lookUp > 0.5 ? -0.8 : 0, 0.15);
  cur.mouth = lerp(cur.mouth, talkLevel(), 0.5);
  if (blinkPhase === "wait" && ts > blinkAt) blinkPhase = "closing";
  if (blinkPhase === "closing") { blink = Math.min(1, blink + 0.34); if (blink >= 1) blinkPhase = "opening"; }
  else if (blinkPhase === "opening") {
    blink = Math.max(0, blink - 0.25);
    if (blink === 0) { blinkPhase = "wait"; blinkAt = ts + 3000 + Math.random() * 4000; }
  }

  const W = cv.width, H = cv.height;
  const anim = state.anim && state.anim.name;
  if (state.photo) { drawSelfie(W, H); drawButtons(W, H); requestAnimationFrame(frame); return; }
  if (anim === "flash") { g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H); requestAnimationFrame(frame); return; }
  if (anim === "countdown") { drawCountdown(W, H); drawButtons(W, H); requestAnimationFrame(frame); return; }
  if (view() === "camera" && !anim) { drawFullCamera(W, H); drawDot(W, H); requestAnimationFrame(frame); return; }
  g.fillStyle = "#05070b"; g.fillRect(0, 0, W, H);
  if (anim === "paw_wave") { drawPaw(W, H, ts); drawDot(W, H); requestAnimationFrame(frame); return; }
  const ew = Math.min(W * 0.22, H * 0.36), eh = ew * 1.15, gap = ew * 0.75;
  const bob = Math.sin(ts / 1400) * H * 0.006;
  eye(W / 2 - gap - ew / 2 + ew / 2, H * 0.40 + bob, ew, eh, -1, ts);
  eye(W / 2 + gap + ew / 2 - ew / 2, H * 0.40 + bob, ew, eh, 1, ts);
  mouth(W / 2, H * 0.74 + bob, ew * 2.2, eh * 0.45, ts);
  drawCam(W, H);
  drawZzz(W, H, ts);
  drawDot(W, H);
  // captions: what Jarvis heard (top) and what he is saying (bottom, instead of the status line)
  if (state.heard) drawHeard(W, H, state.heard);
  if (state.said) { drawSaid(W, H, state.said); requestAnimationFrame(frame); return; }
  // status line: what the robot is doing right now
  const status = state.status || "";
  if (status) {
    g.save();
    g.font = Math.round(H * 0.045) + "px -apple-system, 'Segoe UI', Roboto, sans-serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = "rgba(79, 227, 255, 0.85)";
    g.fillText(status, W / 2, H * 0.93);
    g.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
