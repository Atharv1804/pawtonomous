<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070b">
<title>Jarvis Remote</title>
<style>
  :root { --bg: #05070b; --card: #0e1621; --eye: #4fe3ff; --text: #e8f6fb; --muted: #7d93a3;
          --red: #e5484d; --green: #46c46d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px 28px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  h1 { font-size: 20px; margin: 0; color: var(--eye); letter-spacing: .5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px; }
  .dot.ok { background: var(--green); }
  .card { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .status { font-size: 17px; font-weight: 600; min-height: 22px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; min-height: 18px; }
  button { font: inherit; border: 0; border-radius: 14px; color: var(--text); background: var(--card);
           padding: 16px 8px; font-size: 16px; font-weight: 600; width: 100%; touch-action: manipulation; }
  button:active { transform: scale(.97); }
  button.sent { outline: 2px solid var(--eye); }
  #talk { background: var(--eye); color: #04222b; font-size: 22px; padding: 26px 8px; margin-bottom: 12px; }
  #talk.on { background: var(--red); color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .75; } }
  #stop { background: var(--red); font-size: 22px; padding: 20px 8px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid .wide { grid-column: span 2; }
  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .8px; margin: 14px 2px 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🐾 Jarvis Remote</h1>
    <span class="sub"><span id="conn" class="dot"></span><span id="connText">connecting…</span></span>
  </header>

  <div class="card">
    <div class="status" id="status">…</div>
    <div class="sub" id="heard"></div>
  </div>

  <button id="talk">🎙 TALK</button>
  <button id="stop" data-a="stop">■ STOP</button>

  <div class="label">Move</div>
  <div class="grid">
    <button data-a="follow">🚶 Follow me</button>
    <button data-a="explore">🔍 Explore</button>
  </div>

  <div class="label">Tricks</div>
  <div class="grid">
    <button data-a="greet">👋 Say hi</button>
    <button data-a="bye">🖐 Say bye</button>
    <button data-a="sit">🐕 Sit</button>
    <button data-a="treat">🦴 Treat</button>
  </div>

  <div class="label">Camera</div>
  <div class="grid">
    <button data-a="view_camera">📷 Camera view</button>
    <button data-a="view_face">🙂 Face view</button>
    <button data-a="selfie">🤳 Selfie</button>
    <button data-a="cancel">✕ Cancel selfie</button>
  </div>
</main>
<script>
// Everything is relative to this page's secret URL (/r/<token>), so only someone with the link works it.
const base = location.pathname.replace(/\/$/, "");
const $ = (id) => document.getElementById(id);
let talking = false;

async function post(path, body) {
  const r = await fetch(base + path, {method: "POST", body: JSON.stringify(body)});
  return r.json();
}

function flash(btn) { btn.classList.add("sent"); setTimeout(() => btn.classList.remove("sent"), 400); }

document.querySelectorAll("button[data-a]").forEach((b) => b.addEventListener("click", async () => {
  flash(b);
  try { await post("/act", {action: b.dataset.a}); } catch (e) {}
  if (b.dataset.a === "stop" && talking) setTalk(false);
}));

async function setTalk(on) {
  talking = on;
  $("talk").classList.toggle("on", on);
  $("talk").textContent = on ? "■ DONE: send it" : "🎙 TALK";
  try { await post("/talk", {on: on}); } catch (e) {}
}
$("talk").addEventListener("click", () => setTalk(!talking));

async function poll() {
  try {
    const s = await (await fetch(base + "/state", {cache: "no-store"})).json();
    $("conn").classList.add("ok"); $("connText").textContent = s.owner_here ? "sees you" : "connected";
    $("status").textContent = s.status || "";
    $("heard").textContent = s.heard ? "Heard: “" + s.heard + "”" : "";
    if (talking && !s.talk) setTalk(false);         // the robot finished listening on its own (20 s max)
  } catch (e) {
    $("conn").classList.remove("ok"); $("connText").textContent = "not connected";
  }
  setTimeout(poll, 700);
}
poll();
</script>
</body>
</html>
